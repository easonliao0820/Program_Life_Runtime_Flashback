
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: Godot FastAPI backend

Parameters:
  GoogleOAuthClientId:
    Type: String
    Description: Google OAuth Client ID

  GoogleOAuthWebClientId:
    Type: String
    Description: Google Web OAuth Client ID

  GeminiModel:
    Type: String
    Description: Gemini model used by the AI service

  PlayersTableName:
    Type: String
    Description: Existing DynamoDB players table name

  PlayerErrorsTableName:
    Type: String
    Description: Existing DynamoDB player errors table name

Resources:
  GodotBackendFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: godot-backend-api

      Role: arn:aws:iam::228107396343:role/godot-lambda-execution-role

      CodeUri: backend/
      Handler: lambda_handler.handler

      Runtime: python3.12
      Architectures:
        - x86_64

      MemorySize: 256
      Timeout: 15

      Environment:
        Variables:
          GOOGLE_OAUTH_CLIENT_ID: !Ref GoogleOAuthClientId
          GOOGLE_OAUTH_WEB_CLIENT_ID: !Ref GoogleOAuthWebClientId
          GEMINI_MODEL: !Ref GeminiModel
          PLAYERS_TABLE: !Ref PlayersTableName
          PLAYER_ERRORS_TABLE: !Ref PlayerErrorsTableName

      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - "http://localhost:8060"
            - "https://main.dopnyv7gaqxh9.amplifyapp.com"
          AllowMethods:
            - GET
            - POST
            - PUT
          AllowHeaders:
            - content-type
            - authorization
          AllowCredentials: false
          MaxAge: 300
  
Outputs:
  BackendUrl:
    Description: FastAPI HTTPS URL
    Value: !GetAtt GodotBackendFunctionUrl.FunctionUrl
